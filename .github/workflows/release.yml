name: release

# Publishes the NuGet package when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Uses NuGet.org Trusted Publishing (OIDC) – no API key secret to manage. It requires a
# trusted-publishing policy on nuget.org for this repo/workflow (owner tobler, repo
# sftpserver.net, workflow file release.yml) owned by the nuget.org user below.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write      # required: GitHub issues the OIDC token NuGet exchanges for a short-lived key
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # SourceLink embeds the full git history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      # The tag drives the package version: v0.1.0 -> 0.1.0.
      - name: Build
        run: dotnet build -c Release --no-restore -p:Version="${GITHUB_REF_NAME#v}"

      - name: Test
        run: dotnet test tests/Rst.Ssh.Tests/Rst.Ssh.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/Rst.Ssh/Rst.Ssh.csproj -c Release --no-build -o artifacts -p:Version="${GITHUB_REF_NAME#v}"

      # Trusted Publishing: exchange the OIDC token for a short-lived NuGet API key.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: smt0812          # the nuget.org account that owns the trusted-publishing policy

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
